openapi: 3.0.3
info:
  title: Open Service eFilm API
  description: >-
    REST API for eFilm — browse movies, actors, directors, genres and
    nationalities, manage movie relations, and register/login users.
    Read operations are public; write operations (POST/PUT/DELETE) require
    a Bearer JWT from POST /api/auth/login.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  contact:
    name: Dimas Febriyanto
    url: https://dimassfeb.com
    email: dimassfeb@gmail.com
  version: master - might contain changes that are not yet released
servers:
  - url: https://efilm-api.dimassfeb.com
    description: eFilm API Endpoint (production)
paths:
  /api/users/info:
    post:
      security:
        - bearerAuth: []
      summary: Validate token and getting user info
      tags:
        - Users
      operationId: users.info.get
      parameters:
        - in: header
          name: Authorization
          required: true
          description: Getting from Auth Login
          schema:
            type: string
            example: Bearer {{token}}
      responses:
        '200':
          description: Response Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 200
                  status:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: Success getting info users
                  data:
                    type: object
                    properties:
                      user_id:
                        type: integer
                        example: 30
                      username:
                        type: string
                        example: dimassfeb
                      expired_date:
                        type: string
                        example: '2023-08-04T19:25:42.229484Z'
  /api/auth/register:
    post:
      summary: Register a new user
      tags:
        - Auth
      operationId: auth.register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
  /api/auth/login:
    post:
      summary: Login and get a JWT token
      tags:
        - Auth
      operationId: auth.login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/400'
  /api/nationals:
    post:
      security:
        - bearerAuth: []
      summary: add new national
      tags:
        - National
      operationId: national.post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NationalsRequest'
      responses:
        '200':
          $ref: '#/components/responses/201'
        '400':
          $ref: '#/components/responses/400'
    get:
      summary: get all national
      tags:
        - National
      operationId: national.get.all
      responses:
        '200':
          description: Success get data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllResponseNationalSuccess'
  /api/nationals/search:
    get:
      summary: get national by name
      tags:
        - National
      operationId: national.get.search
      parameters:
        - in: query
          name: name
          schema:
            type: string
          required: true
          description: Name of the national to get
      responses:
        '200':
          description: national response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllResponseNationalSuccess'
  /api/nationals/{id}:
    get:
      summary: get the national by id
      tags:
        - National
      operationId: national.get
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success get data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseNationalSuccess'
        '404':
          $ref: '#/components/responses/404'
    put:
      security:
        - bearerAuth: []
      summary: update data national
      tags:
        - National
      operationId: national.put
      parameters:
        - name: id
          in: path
          description: The ID of the national
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NationalsRequest'
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
    delete:
      security:
        - bearerAuth: []
      summary: Delete data national
      tags:
        - National
      operationId: national.delete
      parameters:
        - name: id
          in: path
          description: The ID of the national
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
  /api/actors:
    post:
      security:
        - bearerAuth: []
      summary: add new actors
      tags:
        - Actors
      operationId: actors.post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActorsRequest'
      responses:
        '200':
          $ref: '#/components/responses/201'
        '400':
          $ref: '#/components/responses/400'
    get:
      summary: get all actors
      tags:
        - Actors
      operationId: actors.get.all
      responses:
        '200':
          description: Success get data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllResponseActorSuccess'
  /api/actors/search:
    get:
      summary: get actors by national_id or name
      tags:
        - Actors
      operationId: actors.get.search
      parameters:
        - in: query
          name: name
          schema:
            type: string
          required: true
          description: Name of the actors to get
        - in: query
          name: national_id
          schema:
            type: integer
          required: false
          description: Numeric ID of the national to get
      responses:
        '200':
          description: actors response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllResponseActorSuccess'
  /api/actors/{id}:
    get:
      summary: get the actors by id
      tags:
        - Actors
      operationId: actors.get
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success get data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseActorSuccess'
        '404':
          $ref: '#/components/responses/404'
    put:
      security:
        - bearerAuth: []
      summary: update data actors
      tags:
        - Actors
      operationId: actors.put
      parameters:
        - name: id
          in: path
          description: The ID of the actors
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActorsRequest'
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
    delete:
      security:
        - bearerAuth: []
      summary: Delete data actors
      tags:
        - Actors
      operationId: actors.delete
      parameters:
        - name: id
          in: path
          description: The ID of the actors
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
  /api/directors:
    post:
      security:
        - bearerAuth: []
      summary: Add new data Directors
      tags:
        - Directors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectorsRequest'
      responses:
        '200':
          $ref: '#/components/responses/201'
        '400':
          $ref: '#/components/responses/400'
    get:
      summary: Get all data Directors
      tags:
        - Directors
      responses:
        '200':
          description: Success get data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllResponseDirectorSuccess'
  /api/directors/search:
    get:
      summary: get directors by name or national_id
      tags:
        - Directors
      operationId: directors.get.search
      parameters:
        - in: query
          name: name
          schema:
            type: string
          required: true
          description: Name of the directors to get
        - in: query
          name: national_id
          schema:
            type: integer
          required: false
          description: National ID of the directors to get
      responses:
        '200':
          description: directors response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllResponseDirectorSuccess'
  /api/directors/{id}:
    get:
      summary: Get Directors by ID
      tags:
        - Directors
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success get data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseDirectorSuccess'
    put:
      security:
        - bearerAuth: []
      summary: Add new data Directors
      tags:
        - Directors
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectorsRequest'
      responses:
        '200':
          $ref: '#/components/responses/201'
        '400':
          $ref: '#/components/responses/400'
    delete:
      security:
        - bearerAuth: []
      summary: Delete data Directors
      tags:
        - Directors
      operationId: directors.delete
      parameters:
        - name: id
          in: path
          description: The ID of the actors
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
  /api/movies/recommendation:
    get:
      summary: Get all recommended movies
      tags:
        - Movie Recommendation
      operationId: movies.recommendation.get.all
      responses:
        '200':
          description: Success get data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllResponseRecommendationSuccess'
    post:
      security:
        - bearerAuth: []
      summary: Add a movie to recommendations
      tags:
        - Movie Recommendation
      operationId: movies.recommendation.post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
  /api/movies/recommendation/{movie_id}:
    delete:
      security:
        - bearerAuth: []
      summary: Remove a movie from recommendations
      tags:
        - Movie Recommendation
      operationId: movies.recommendation.delete
      parameters:
        - name: movie_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
  /api/genres:
    post:
      security:
        - bearerAuth: []
      summary: Add new data Genres
      tags:
        - Genres
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenresRequest'
      responses:
        '200':
          $ref: '#/components/responses/201'
        '400':
          $ref: '#/components/responses/400'
    get:
      summary: Get all data Genres
      tags:
        - Genres
      responses:
        '200':
          description: Success get data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllResponseGenreSuccess'
  /api/genres/search:
    get:
      summary: get genres by name
      tags:
        - Genres
      operationId: genres.get.search
      parameters:
        - in: query
          name: name
          schema:
            type: string
          required: true
          description: Name of the genres to get
      responses:
        '200':
          description: genres response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseGenreSuccess'
  /api/genres/{id}:
    get:
      summary: Get Genres by ID
      tags:
        - Genres
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success get data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseGenreSuccess'
    put:
      security:
        - bearerAuth: []
      summary: Update data Genres
      tags:
        - Genres
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenresRequest'
      responses:
        '200':
          $ref: '#/components/responses/201'
        '400':
          $ref: '#/components/responses/400'
    delete:
      security:
        - bearerAuth: []
      summary: Delete data genres
      tags:
        - Genres
      operationId: genres.put
      parameters:
        - name: id
          in: path
          description: The ID of the actors
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
  /api/genres/{id}/movies:
    get:
      summary: Get all movies of a genre
      tags:
        - Genres
      operationId: genres.movies.get.all
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success get data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllResponseMovieSuccess'
        '404':
          $ref: '#/components/responses/404'
  /api/movies:
    post:
      security:
        - bearerAuth: []
      summary: add new movie
      tags:
        - Movie
      operationId: movie.post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoviesRequest'
      responses:
        '200':
          $ref: '#/components/responses/201'
        '400':
          $ref: '#/components/responses/400'
    get:
      summary: get all movie
      tags:
        - Movie
      operationId: movie.get.all
      responses:
        '200':
          description: Success get data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllResponseMovieSuccess'
  /api/movies/search:
    get:
      summary: get movie by name, release date
      tags:
        - Movie
      operationId: movie.get.search
      parameters:
        - in: query
          name: name
          schema:
            type: string
          required: true
          description: Name of the movie to get
      responses:
        '200':
          description: movie response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllResponseMovieSuccess'
  /api/movies/{movie_id}/upload_poster:
    post:
      security:
        - bearerAuth: []
      summary: Upload Poster to Movie
      tags:
        - Movie
      operationId: movie.upload.poster.post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                poster_file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Success get data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseMovieSuccess'
        '404':
          $ref: '#/components/responses/404'
  /api/movies/{movie_id}:
    get:
      summary: get the movie by id
      tags:
        - Movie
      operationId: movie.get
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success get data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseMovieSuccess'
        '404':
          $ref: '#/components/responses/404'
    put:
      security:
        - bearerAuth: []
      summary: update data movie
      tags:
        - Movie
      operationId: movie.put
      parameters:
        - name: id
          in: path
          description: The ID of the movie
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoviesRequest'
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
    delete:
      security:
        - bearerAuth: []
      summary: Delete data movie
      tags:
        - Movie
      operationId: movie.delete
      parameters:
        - name: id
          in: path
          description: The ID of the movie
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
  /api/movies/{movie_id}/actors:
    post:
      security:
        - bearerAuth: []
      summary: Add a new actor to a movie
      tags:
        - Movie Actor
      operationId: movie.actors.post
      parameters:
        - name: movie_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - actor_id
                - role
              properties:
                actor_id:
                  type: integer
                  example: 1
                role:
                  type: string
                  example: Lead Actor
      responses:
        '200':
          $ref: '#/components/responses/200'
    get:
      summary: Get a list of actors with a specific movie
      tags:
        - Movie Actor
      operationId: movie.actors.get.all
      parameters:
        - name: movie_id
          in: path
          required: true
          example: 1
          schema:
            type: integer
      responses:
        '200':
          description: Success get data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseMovieActorSuccess'
  /api/movies/{movie_id}/actors/{actor_id}:
    put:
      security:
        - bearerAuth: []
      summary: Update the role of an actors in a movie
      tags:
        - Movie Actor
      operationId: movie.actors.put
      parameters:
        - name: movie_id
          in: path
          required: true
          example: 2
          schema:
            type: integer
        - name: actor_id
          in: path
          required: true
          example: 1
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  example: Lead Actor
      responses:
        '200':
          $ref: '#/components/responses/200'
    delete:
      security:
        - bearerAuth: []
      summary: Remove an actor from a movie
      tags:
        - Movie Actor
      operationId: movie.actors.delete
      parameters:
        - name: movie_id
          in: path
          required: true
          example: 2
          schema:
            type: integer
        - name: actor_id
          in: path
          required: true
          example: 1
          schema:
            type: integer
      responses:
        '200':
          $ref: '#/components/responses/200'
  /api/movies/{movie_id}/directors:
    post:
      security:
        - bearerAuth: []
      summary: Add a new director to a movie
      tags:
        - Movie Director
      operationId: movie.directors.post
      parameters:
        - name: movie_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - director_id
              properties:
                director_id:
                  type: integer
                  example: 1
      responses:
        '200':
          $ref: '#/components/responses/200'
    get:
      summary: Get a list of directors with a specific movie
      tags:
        - Movie Director
      operationId: movie.directors.get.all
      parameters:
        - name: movie_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success get data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseMovieDirectorSuccess'
  /api/movies/{movie_id}/directors/{director_id}:
    delete:
      security:
        - bearerAuth: []
      summary: Remove an director from a movie
      tags:
        - Movie Director
      operationId: movie.directors.delete
      parameters:
        - name: movie_id
          in: path
          required: true
          example: 2
          schema:
            type: integer
        - name: director_id
          in: path
          required: true
          example: 1
          schema:
            type: integer
      responses:
        '200':
          $ref: '#/components/responses/200'
  /api/movies/{movie_id}/genres:
    post:
      security:
        - bearerAuth: []
      summary: Add a new genre to a movie
      tags:
        - Movie Genre
      operationId: movie.genres.post
      parameters:
        - name: movie_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - genre_id
              properties:
                genre_id:
                  type: integer
                  example: 1
      responses:
        '200':
          $ref: '#/components/responses/200'
    get:
      summary: Get a list of genres with a specific movie
      tags:
        - Movie Genre
      operationId: movie.genres.get.all
      parameters:
        - name: movie_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success get data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseMovieGenreSuccess'
  /api/movies/{movie_id}/genres/{genre_id}:
    delete:
      security:
        - bearerAuth: []
      summary: Remove an genre from a movie
      tags:
        - Movie Genre
      operationId: movie.genres.delete
      parameters:
        - name: movie_id
          in: path
          required: true
          example: 2
          schema:
            type: integer
        - name: genre_id
          in: path
          required: true
          example: 1
          schema:
            type: integer
      responses:
        '200':
          $ref: '#/components/responses/200'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT token from POST /api/auth/login, sent as 'Authorization: Bearer <token>'."

  schemas:
    AuthRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: dimassfeb
        password:
          type: string
          example: secret123
    AuthResponse:
      type: object
      properties:
        code:
          type: number
          example: 200
        status:
          type: string
          example: OK
        message:
          type: string
          example: Success login with username dimassfeb
        data:
          type: object
          properties:
            token:
